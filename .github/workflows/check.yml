name: Check skin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reproducible client
        run: |
          npm run build
          git diff --exit-code -- lib/client.js
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Inspect runtime package
        run: npm pack --dry-run
      - name: Build Windows v2.4.11 smoke-test archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'skin-smoke'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          npm pack --pack-destination $out
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed" }
          $archive = Join-Path $out 'dsh-industrial-acid-skin-2.4.11.tgz'
          if (!(Test-Path $archive)) { throw "Expected versioned archive is missing" }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  dsh-industrial-acid-skin-2.4.11.tgz" | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
      - name: Upload Windows smoke-test archive (not a Release)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-skin-2.4.11-windows-smoke
          path: ${{ runner.temp }}/skin-smoke/*
          if-no-files-found: error
          retention-days: 14
